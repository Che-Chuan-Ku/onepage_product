# Render Blueprint — gomoku 五子棋（單容器：nginx + Spring 後端 + Next 前端）
# 一個 Docker image（根 Dockerfile）內跑 nginx(:$PORT) 反代 → backend(:8080) / frontend(:3000)。
# REST /api 與 WebSocket /ws 皆同源經 nginx 代理到後端（免 CORS）。
# DB 由 deploy/start.sh 依 DB_* 組出 DB_URL(?sslmode=require)，backend 走 production profile 讀取。
services:
  - type: web
    name: onepage-product
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: gomoku-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gomoku-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gomoku-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gomoku-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gomoku-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JVM_OPTS
        value: "-Xmx300m -Xms128m"

databases:
  # 專屬空 DB：gomoku Flyway V1__init 需乾淨 schema，不可共用 onepage 既有 DB
  - name: gomoku-db
    databaseName: gomoku
    user: gomoku
    plan: free
