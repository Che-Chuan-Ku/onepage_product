<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五子棋 — 對局回放</title>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<div id="hdr"></div>
<main class="page">
  <div class="row gap-8 wrap" style="margin-bottom:14px">
    <span class="dim">切換情境：</span>
    <a class="btn btn-ghost" style="min-height:34px" href="index.html">一般 / Swap2</a>
    <a class="btn btn-ghost" style="min-height:34px" href="index.html?mode=duel&field=volcano">真劍勝負·火山</a>
    <a class="btn btn-ghost" style="min-height:34px" href="index.html?mode=duel&field=beach">真劍勝負·沙灘</a>
  </div>
  <div class="layout">
    <section>
      <div class="board-wrap"><canvas class="board" id="board"></canvas></div>
      <!-- replay controls -->
      <div class="card pad mt-16">
        <div class="row gap-8">
          <button class="btn btn-ghost" onclick="step(-1)" aria-label="上一步">⏮ 上一步</button>
          <button class="btn btn-primary grow" id="playBtn" onclick="togglePlay()">▶ 播放</button>
          <button class="btn btn-ghost" onclick="step(1)" aria-label="下一步">下一步 ⏭</button>
        </div>
        <input type="range" id="bar" min="0" max="0" value="0" style="width:100%;margin-top:14px" oninput="seek(this.value)">
        <div class="row mt-8" style="justify-content:space-between"><span class="dim num" id="pos">0 / 0</span>
          <span class="dim" id="cur"></span></div>
      </div>
    </section>
    <aside class="sidebar">
      <div class="card pad">
        <h3 style="margin-bottom:12px">對局資訊</h3>
        <div class="row" style="justify-content:space-between"><span class="dim">勝者</span><span id="winnerLabel">阿哲（黑）</span></div>
        <div class="row mt-8" style="justify-content:space-between"><span class="dim">落子數</span><span class="num" id="total">—</span></div>
        <div class="row mt-8" style="justify-content:space-between"><span class="dim">開局</span><span class="badge badge-swap2" id="openingBadge">Swap2</span></div>
        <!-- 真劍勝負對局：場地類型 + 雙方職業（需求 #47） -->
        <div id="duelInfoRows" style="display:none">
          <div class="row mt-8" style="justify-content:space-between"><span class="dim">場地</span><span id="replayFieldLabel">—</span></div>
          <div class="row mt-8" style="justify-content:space-between"><span class="dim">阿哲職業</span><span id="replayP1Class">—</span></div>
          <div class="row mt-8" style="justify-content:space-between"><span class="dim">你的職業</span><span id="replayP2Class">—</span></div>
        </div>
      </div>
      <div class="card pad" id="legendCard"><p class="dim" style="font-size:13px">⭕ 帶金圈者為 Swap2 開局子（序列起始可識別並重播）。</p></div>
      <!-- 真劍勝負：本手事件（技能/場地）與隱藏格全揭露提示（需求 #45 #47） -->
      <div class="card pad" id="eventCard" style="display:none">
        <h3 style="margin-bottom:10px">本手事件</h3>
        <p class="dim" id="eventText" style="font-size:13px">—</p>
        <p class="dim mt-8" style="font-size:12px">回放中隱藏格（噴發/漲潮）已完整揭露，不受對局中隱藏限制（需求 #44 #47）。</p>
      </div>
    </aside>
  </div>
</main>

<script src="../assets/ui.js"></script>
<script src="../assets/board.js"></script>
<script>
document.getElementById('hdr').innerHTML=renderHeader({identity:'registered',nickname:'KuPlayer'});
const P=new URLSearchParams(location.search);
const isDuelReplay=P.get('mode')==='duel';
const field=P.get('field')||'volcano';

const board=new GomokuBoard(document.getElementById('board'),Object.assign({interactive:false},isDuelReplay?{size:field==='beach'?16:15,field:field}:{}));

// move sequence: openingStones first (swap2), then regular moves
const moves=!isDuelReplay?[
  {r:7,c:7,color:'black',opening:true},
  {r:7,c:8,color:'white',opening:true},
  {r:8,c:7,color:'black',opening:true},
  {r:8,c:8,color:'white'},
  {r:6,c:7,color:'black'},
  {r:9,c:6,color:'white'},
  {r:5,c:7,color:'black'},
  {r:8,c:6,color:'white'},
  {r:4,c:7,color:'black'},   // black wins vertical 4..8 col7
] : [
  // 真劍勝負回放：落子序列與技能/場地事件依 moveNumber 交錯（fieldEvents,需求 #45 #47）
  {r:7,c:7,color:'black'},
  {r:8,c:8,color:'white'},
  {r:6,c:7,color:'black',event:'橫劈：推擠橫排3格'},
  {r:9,c:9,color:'white'},
  {r:5,c:7,color:'black',event:'🌋 火山噴發：燒毀周邊 8 格'},
  {r:9,c:6,color:'white',event:'精準狙擊：替換敵方棋子'},
  {r:4,c:7,color:'black'},
  {r:9,c:8,color:'white'},
  {r:3,c:7,color:'black'},   // 黑方連五
];

if(isDuelReplay){
  document.getElementById('openingBadge').style.display='none';
  document.getElementById('legendCard').style.display='none';
  document.getElementById('duelInfoRows').style.display='block';
  document.getElementById('eventCard').style.display='block';
  document.getElementById('replayFieldLabel').textContent = field==='volcano'?'🌋 火山':'🏖️ 沙灘（16×16）';
  document.getElementById('replayP1Class').textContent='⚔️ 劍士';
  document.getElementById('replayP2Class').textContent='🏹 弓箭手';
  document.getElementById('winnerLabel').textContent='阿哲（黑）';
  if(field==='volcano') board.setObstacles([[2,2],[2,12],[12,2],[12,12],[4,10],[10,4]]);
  else board.setBeach('top',1);
  board.revealAll([{r:5,c:7,kind:'eruption'}]);
}

document.getElementById('total').textContent=moves.length;
document.getElementById('bar').max=moves.length;
let idx=0, playing=false, timer;

function render(){
  const sub=moves.slice(0,idx);
  board.set(sub.map(m=>({r:m.r,c:m.c,color:m.color})),{
    opening:moves.filter(m=>m.opening),
    last: idx>0?[moves[idx-1].r,moves[idx-1].c]:null
  });
  document.getElementById('bar').value=idx;
  document.getElementById('pos').textContent=idx+' / '+moves.length;
  const c=document.getElementById('cur');
  c.textContent = idx>0 ? ('第 '+idx+' 手 · '+(moves[idx-1].opening?'開局子':(moves[idx-1].color==='black'?'黑':'白'))) : '起始';
  if(isDuelReplay){
    const ev = idx>0 ? moves[idx-1].event : null;
    document.getElementById('eventText').textContent = ev || '（本手無技能/場地事件）';
  }
}
function step(d){idx=Math.max(0,Math.min(moves.length,idx+d));render();}
function seek(v){idx=+v;render();}
function togglePlay(){
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ 暫停':'▶ 播放';
  if(playing){ if(idx>=moves.length)idx=0;
    timer=setInterval(()=>{ if(idx>=moves.length){togglePlay();return;} idx++;render(); },800);
  } else clearInterval(timer);
}
render();
</script>
</body>
</html>
