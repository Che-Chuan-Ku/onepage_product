    modified_outputs:
      - "prototype/pve-game/index.html"
      - "prototype/pve-shop/index.html"
      - "prototype/assets/theme.css"
      - "prototype/_tests/pve-smoke.mjs"
    features_touched: ["pve-game","pve-shop"]
    conflicts_found: 0
