      仍正確記錄「橫劈」，關卡失敗結算 pveResult.usedSkillsSnapshot 與結算頁 DOM 皆正確顯示「橫劈」
      （而非因庫存已空而誤判「無」）；B3) pve-shop 於 ≤640px viewport 下 .shop-actionbar
