      node prototype/_tests/pve-smoke.mjs（Playwright chromium，本機臨時 http 伺服器獨立於共用 MCP
      瀏覽器實例，借用 frontend/node_modules/playwright 但未修改 frontend 任何檔案）：連續執行兩次皆
      5/5 全數通過 —— A) 8關全通關且第1關以真實觸控（無鍵盤）路徑落子：確認鈕初始 disabled，
      點擊空格後轉為可按，按下後 movesUsed 正確 +1，全程 console 無 error；B1) 強制第2關為 BEACH
      後兩次呼叫 triggerWave()，enc.erosion/board.erosion 由 0→1→2 逐次累加（非單次 flash），
