openapi: 3.0.0
info:
  title: Gomoku Platform API
  version: v1
  description: >
    五子棋對戰平台 API 契約。由 demand_analysis 模組（Phase 04）從 features 推導。
    即時對局（落子廣播、開局同步、聊天）走 STOMP over WebSocket，見文末 x-stomp-channels；
    本契約定義 REST command/query 端點（伺服器權威驗證入口）。

servers:
  - url: /api/{system-code}/{api-version}
    variables:
      system-code:
        default: gmk
      api-version:
        default: v1

tags:
  - name: auth
    description: 註冊 / 登入
  - name: players
    description: 玩家戰績與排行榜
  - name: rooms
    description: 房間建立 / 加入 / 配對 / 準備
  - name: games
    description: 對局開局、落子、Swap2
  - name: history
    description: 對局歷史與回放

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerPlayer
      summary: 註冊帳號
      description: Email/Username + 密碼註冊，成功後建立玩家帳號。對應 PlayerRegistered。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 註冊成功
          headers:
            Location:
              schema: { type: string }
              description: 新玩家資源位置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlayerDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/login:
    post:
      tags: [auth]
      operationId: loginPlayer
      summary: 登入取得 JWT
      description: 帳密驗證成功後回傳 JWT。對應 PlayerLoggedIn。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/guest:
    post:
      tags: [auth]
      operationId: enterAsGuest
      summary: 訪客模式進入
      description: 以非空暱稱建立臨時玩家身份（線上僅限單場）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestEnterRequest'
      responses:
        '200':
          description: 進入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuestEnterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /players/{playerId}/stats:
    get:
      tags: [players]
      operationId: getPlayerStats
      summary: 查看個人戰績
      description: 回傳勝場、敗場、勝率與最近對戰紀錄（需求 #3）。
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
          description: 玩家 ID
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlayerStatsResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /leaderboard:
    get:
      tags: [players]
      operationId: getLeaderboard
      summary: 查看排行榜
      description: >
        排行榜（需求 #3）。主排序鍵 wins DESC、次鍵 winRate DESC（Q2）；
        僅列入累計對局數（wins+losses）>= 10 的玩家。
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
          description: 略過筆數
        - name: top
          in: query
          schema: { type: integer, default: 20 }
          description: 取回筆數
        - name: order
          in: query
          schema: { type: string, default: 'wins desc, winRate desc' }
          description: 排序欄位（主鍵勝場數、次鍵勝率，皆 DESC）
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ManagePageResponse'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/LeaderboardEntryResponse'

  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 建立房間
      description: 建立私人/公開房間，可選 Swap2 模式，產生唯一房間碼。對應 RoomCreated。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: 建立成功
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [rooms]
      operationId: listPublicRooms
      summary: 公開房間列表
      description: 列出 PUBLIC 且 WAITING 的房間（需求 #5）。
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
        - name: top
          in: query
          schema: { type: integer, default: 20 }
        - name: order
          in: query
          schema: { type: string, default: 'createdAt desc' }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ManagePageResponse'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/RoomListResponse'

  /rooms/{roomId}/actions/join:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: 加入房間
      description: >
        以房間碼或房間 ID 加入。對戰席未滿（上限 2）→ 成為對戰玩家（PlayerJoinedRoom）；
        對戰席已滿 → 自動成為觀戰者（SpectatorJoinedRoom）。回應 data.joinedAsRole 標明角色（Q5）。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 加入成功（角色見 joinedAsRole）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/actions/quick-match:
    post:
      tags: [rooms]
      operationId: quickMatch
      summary: 快速配對
      description: >
        進入配對佇列；佇列有等待者時自動配對成局（需求 #6）。
        佇列等待逾 60 秒未配對 → 退出佇列並提示「排隊過久請重新開始配對」（Q6，由後端計時 + WS 通知）。
      responses:
        '200':
          description: 已進入佇列或已配對
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuickMatchResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rooms/{roomId}/actions/toggle-ready:
    post:
      tags: [rooms]
      operationId: toggleReady
      summary: 切換 Ready 狀態
      description: >
        切換自己的 Ready；兩名對戰玩家皆 Ready 觸發開局。對應 PlayerReadyToggled / AllPlayersReady。
        僅 role=PLAYER 可操作，觀戰者呼叫回 403（Q5）。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 切換成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games:
    post:
      tags: [games]
      operationId: startLocalGame
      summary: 開始本地遊戲
      description: 建立本地對局，可選 useSwap2（假先方系統隨機）。對應 LocalGameStarted。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalGameCreateRequest'
      responses:
        '201':
          description: 建立成功
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /games/{gameId}/actions/coin-toss:
    post:
      tags: [games]
      operationId: tossCoin
      summary: 投擲硬幣
      description: 後端決定硬幣結果；普通模式定黑白、Swap2 定假先方。對應 CoinTossCompleted。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 投擲完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoinTossResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{gameId}/moves:
    post:
      tags: [games]
      operationId: placeMove
      summary: 落子
      description: >
        伺服器權威驗證落子（位置合法、輪次、勝負）。對應 MovePlaced / WinConditionMet /
        GameDraw / InvalidMoveRejected。線上模式驗證後經 STOMP 廣播。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCreateRequest'
      responses:
        '201':
          description: 落子成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 落子不合法（非當前回合 / 位置已佔 / 超出棋盤）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        type: object

  /games/{gameId}/opening-stones:
    post:
      tags: [games]
      operationId: placeOpeningStone
      summary: Swap2 開局放置
      description: 假先方放置開局子（每子確認）。僅假先方可操作。對應 OpeningStonePlaced。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningStoneCreateRequest'
      responses:
        '201':
          description: 放置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /games/{gameId}/opening-stones/actions/undo-last:
    post:
      tags: [games]
      operationId: undoLastOpeningStone
      summary: 悔開局最後一子
      description: 僅允許移除最後放置的開局子（需求 #31）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已移除最後一子
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /games/{gameId}/actions/swap2-choice:
    post:
      tags: [games]
      operationId: makeSwap2Choice
      summary: Swap2 假後方選擇
      description: 假後方三選一，定案最終黑白與輪次。對應 Swap2ChoiceMade / ColorAssignmentFinalized / OpeningCompleted。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Swap2ChoiceRequest'
      responses:
        '200':
          description: 選擇完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /games/{gameId}/actions/rematch:
    post:
      tags: [games]
      operationId: rematchGame
      summary: 再戰
      description: 本地重置（保留名稱）或線上重新開局（需求 #12 #14）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: 新局已建立
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameDetailResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{gameId}/replay:
    get:
      tags: [history]
      operationId: getGameReplay
      summary: 取得對局回放
      description: 回傳完整落子序列（含 openingStones）供重播（需求 #17 #32）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameReplayResponse'
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    ManageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: string
          example: "200000"
        message:
          type: string
          example: OK

    ManagePageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        totalCount:
          type: integer
          example: 100

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: carol }
        email: { type: string, format: email, example: carol@example.com }
        password:
          type: string
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*\d).{8,}$'
          example: "P@ssw0rd1"
          description: '最短 8 碼，須同時含英文小寫字母與數字；允許大小寫/數字/符號（Q3）'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, example: "P@ssw0rd1" }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: JWT }
        playerId: { type: string, example: "p-001" }

    GuestEnterRequest:
      type: object
      required: [nickname]
      properties:
        nickname: { type: string, example: "路人甲" }

    GuestEnterResponse:
      type: object
      properties:
        guestId: { type: string, example: "g-abc" }
        nickname: { type: string, example: "路人甲" }

    PlayerDetailResponse:
      type: object
      properties:
        playerId: { type: string }
        username: { type: string }
        email: { type: string }

    PlayerStatsResponse:
      type: object
      properties:
        playerId: { type: string }
        wins: { type: integer, example: 8 }
        losses: { type: integer, example: 2 }
        draws: { type: integer, example: 0, description: '和局數（含雙方同時斷線判和）' }
        winRate: { type: number, format: float, example: 0.80 }
        recentGames:
          type: array
          items:
            $ref: '#/components/schemas/RecentGameItem'

    RecentGameItem:
      type: object
      properties:
        gameId: { type: string }
        result: { type: string, enum: [BLACK_WIN, WHITE_WIN, DRAW] }
        endedAt: { type: string, example: "2026-05-24T12:00:00+08:00" }

    LeaderboardEntryResponse:
      type: object
      description: '排序：wins DESC 為主、winRate DESC 為次；僅含 wins+losses>=10 的玩家（Q2）'
      properties:
        rank: { type: integer, example: 1 }
        playerId: { type: string }
        username: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number, format: float }

    RoomCreateRequest:
      type: object
      required: [visibility]
      properties:
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        isSwap2Mode: { type: boolean, default: false }

    RoomDetailResponse:
      type: object
      properties:
        roomId: { type: string }
        roomCode: { type: string, example: ABC123 }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        status: { type: string, enum: [WAITING, READY, IN_PROGRESS, FINISHED] }
        isSwap2Mode: { type: boolean }
        joinedAsRole:
          type: string
          enum: [PLAYER, SPECTATOR]
          nullable: true
          description: '本次加入後當前使用者的角色（joinRoom 回應用）'
        spectatorCount: { type: integer, example: 0, description: '觀戰席人數' }
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoomMemberItem'

    RoomMemberItem:
      type: object
      properties:
        playerId: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [PLAYER, SPECTATOR], description: 'PLAYER=對戰席 / SPECTATOR=觀戰席' }
        isReady: { type: boolean, description: '觀戰席恆 false' }

    RoomListResponse:
      type: object
      properties:
        roomId: { type: string }
        roomCode: { type: string }
        hostNickname: { type: string }
        playerCount: { type: integer, description: '對戰席人數（0..2）' }
        spectatorCount: { type: integer, description: '觀戰席人數' }
        isSwap2Mode: { type: boolean }

    QuickMatchResponse:
      type: object
      properties:
        matched: { type: boolean }
        roomId: { type: string, nullable: true }
        queuePosition: { type: integer, nullable: true }

    LocalGameCreateRequest:
      type: object
      required: [useSwap2]
      properties:
        useSwap2: { type: boolean, default: false }
        blackNickname: { type: string, example: "甲" }
        whiteNickname: { type: string, example: "乙" }

    GameDetailResponse:
      type: object
      properties:
        gameId: { type: string }
        gameMode: { type: string, enum: [LOCAL, ONLINE] }
        useSwap2: { type: boolean }
        status: { type: string, enum: [OPENING, PLAYING, FINISHED] }
        currentTurn: { type: string, enum: [BLACK, WHITE], nullable: true }

    CoinTossResponse:
      type: object
      properties:
        gameId: { type: string }
        coinResult: { type: string, enum: [HEADS, TAILS] }
        tentativeFirstPlayerId: { type: string, nullable: true, description: Swap2 假先方 }
        blackPlayerId: { type: string, nullable: true }
        whitePlayerId: { type: string, nullable: true }

    MoveCreateRequest:
      type: object
      required: [row, col]
      properties:
        row: { type: integer, minimum: 0, maximum: 14, example: 7 }
        col: { type: integer, minimum: 0, maximum: 14, example: 7 }

    GameStateResponse:
      type: object
      properties:
        gameId: { type: string }
        status: { type: string, enum: [OPENING, PLAYING, FINISHED] }
        currentTurn: { type: string, enum: [BLACK, WHITE], nullable: true }
        moveCount: { type: integer }
        lastMove:
          type: object
          nullable: true
          properties:
            color: { type: string, enum: [BLACK, WHITE] }
            row: { type: integer }
            col: { type: integer }
        result: { type: string, enum: [BLACK_WIN, WHITE_WIN, DRAW], nullable: true }
        winningLine:
          type: array
          nullable: true
          items:
            type: object
            properties:
              row: { type: integer }
              col: { type: integer }

    OpeningStoneCreateRequest:
      type: object
      required: [row, col, color]
      properties:
        row: { type: integer, minimum: 0, maximum: 14 }
        col: { type: integer, minimum: 0, maximum: 14 }
        color: { type: string, enum: [BLACK, WHITE] }

    Swap2ChoiceRequest:
      type: object
      required: [choice]
      properties:
        choice: { type: string, enum: [TAKE_BLACK, TAKE_WHITE, PLACE_TWO_MORE] }

    GameReplayResponse:
      type: object
      properties:
        gameId: { type: string }
        result: { type: string, enum: [BLACK_WIN, WHITE_WIN, DRAW] }
        winnerPlayerId: { type: string, nullable: true }
        moveCount: { type: integer }
        useSwap2: { type: boolean }
        openingStones:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              color: { type: string, enum: [BLACK, WHITE] }
              row: { type: integer }
              col: { type: integer }
        moves:
          type: array
          items:
            type: object
            properties:
              moveNumber: { type: integer }
              color: { type: string, enum: [BLACK, WHITE] }
              row: { type: integer }
              col: { type: integer }

  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "400001" }
                  data: { type: object }
    Unauthorized:
      description: 未登入或憑證無效
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "401001" }
                  data: { type: object }
    Forbidden:
      description: 權限不足（如非假先方放置開局子）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "403001" }
                  data: { type: object }
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "404001" }
                  data: { type: object }
    UnprocessableEntity:
      description: 業務規則不滿足（落子不合法、悔非最後一子等）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "422001" }
                  data: { type: object }

# ── STOMP over WebSocket 即時通道（需求 #9 #15 #16 #28）────
# 非 REST，列此供 frontend / backend 對齊；不屬 OpenAPI paths
x-stomp-channels:
  - destination: /topic/room/{roomId}
    purpose: 房間內 Ready 狀態與聊天廣播（需求 #7）
  - destination: /topic/game/{gameId}
    purpose: 對局狀態更新廣播 GameStateUpdated（需求 #16）
  - destination: /topic/game/{gameId}/opening
    purpose: Swap2 開局即時同步與權限控制（需求 #28）
  - destination: /app/game/{gameId}/move
    purpose: 玩家送出落子（後端驗證後廣播）
