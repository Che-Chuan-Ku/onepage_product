openapi: 3.0.0
info:
  title: Gomoku Platform API
  version: v1
  description: >
    五子棋對戰平台 API 契約。由 demand_analysis 模組（Phase 04）從 features 推導。
    即時對局（落子廣播、開局同步、聊天）走 STOMP over WebSocket，見文末 x-stomp-channels；
    本契約定義 REST command/query 端點（伺服器權威驗證入口）。

servers:
  - url: /api/{system-code}/{api-version}
    variables:
      system-code:
        default: gmk
      api-version:
        default: v1

tags:
  - name: auth
    description: 註冊 / 登入
  - name: players
    description: 玩家戰績與排行榜
  - name: rooms
    description: 房間建立 / 加入 / 配對 / 準備
  - name: games
    description: 對局開局、落子、Swap2
  - name: history
    description: 對局歷史與回放
  - name: pve
    description: >
      PVE 挑戰模式（documents/PVE-挑戰模式-增量需求.md）：建立 Run、關卡落子、技能使用、
      商店購買/重抽/跳過、放棄 Run。單人模式一律 HTTP request/response，不使用 STOMP（§6）；
      現有 PVP 契約零修改。

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: registerPlayer
      summary: 註冊帳號
      description: Email/Username + 密碼註冊，成功後建立玩家帳號。對應 PlayerRegistered。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 註冊成功
          headers:
            Location:
              schema: { type: string }
              description: 新玩家資源位置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlayerDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/login:
    post:
      tags: [auth]
      operationId: loginPlayer
      summary: 登入取得 JWT
      description: 帳密驗證成功後回傳 JWT。對應 PlayerLoggedIn。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/guest:
    post:
      tags: [auth]
      operationId: enterAsGuest
      summary: 訪客模式進入
      description: 以非空暱稱建立臨時玩家身份（線上僅限單場）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestEnterRequest'
      responses:
        '200':
          description: 進入成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuestEnterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /players/{playerId}/stats:
    get:
      tags: [players]
      operationId: getPlayerStats
      summary: 查看個人戰績
      description: 回傳勝場、敗場、勝率與最近對戰紀錄（需求 #3）。
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
          description: 玩家 ID
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PlayerStatsResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /leaderboard:
    get:
      tags: [players]
      operationId: getLeaderboard
      summary: 查看排行榜
      description: >
        排行榜（需求 #3）。主排序鍵 wins DESC、次鍵 winRate DESC（Q2）；
        僅列入累計對局數（wins+losses）>= 10 的玩家。
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
          description: 略過筆數
        - name: top
          in: query
          schema: { type: integer, default: 20 }
          description: 取回筆數
        - name: order
          in: query
          schema: { type: string, default: 'wins desc, winRate desc' }
          description: 排序欄位（主鍵勝場數、次鍵勝率，皆 DESC）
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ManagePageResponse'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/LeaderboardEntryResponse'

  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 建立房間
      description: 建立私人/公開房間，可選 Swap2 模式，產生唯一房間碼。對應 RoomCreated。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: 建立成功
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: >
            真劍勝負模式參數衝突（需求 #34，Q9）：
            (1) battleMode=SERIOUS_DUEL 與 isSwap2Mode=true 同時指定；
            (2) battleMode=SERIOUS_DUEL 但未指定 fieldType。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      code: { type: string, example: "422002" }
                      data: { type: object }
    get:
      tags: [rooms]
      operationId: listPublicRooms
      summary: 公開房間列表
      description: >
        列出 PUBLIC 且 WAITING 的房間（需求 #5）。Bug fix（additive）：WAITING 逾 30
        分鐘未達 Ready 的房間視為逾期，不再回傳（房間 TTL，見 RoomService 常數
        WAITING_ROOM_TTL_MINUTES）；逾期房間亦由後端排程定期軟刪除。
      parameters:
        - name: skip
          in: query
          schema: { type: integer, default: 0 }
        - name: top
          in: query
          schema: { type: integer, default: 20 }
        - name: order
          in: query
          schema: { type: string, default: 'createdAt desc' }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/ManagePageResponse'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/RoomListResponse'

  /rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoomDetail
      summary: 查詢房間詳情
      description: 查詢房間目前狀態、成員名單與職業/Ready 狀況（供進房後輪詢或重連使用）。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/{roomId}/actions/join:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: 加入房間
      description: >
        以房間碼或房間 ID 加入。對戰席未滿（上限 2）→ 成為對戰玩家（PlayerJoinedRoom）；
        對戰席已滿 → 自動成為觀戰者（SpectatorJoinedRoom）。回應 data.joinedAsRole 標明角色（Q5）。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 加入成功（角色見 joinedAsRole）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rooms/actions/quick-match:
    post:
      tags: [rooms]
      operationId: quickMatch
      summary: 快速配對
      description: >
        進入配對佇列；佇列有等待者時自動配對成局（需求 #6）。
        佇列等待逾 60 秒未配對 → 退出佇列並提示「排隊過久請重新開始配對」（Q6，由後端計時 + WS 通知）。
      responses:
        '200':
          description: 已進入佇列或已配對
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuickMatchResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rooms/{roomId}/actions/select-class:
    post:
      tags: [rooms]
      operationId: selectClass
      summary: 真劍勝負職業選擇
      description: >
        真劍勝負模式限定。進房後 Ready 前可自選或變更職業（劍士/弓箭手，可同職業）；
        Ready 後鎖定，再呼叫回 422。對應 ClassSelected（需求 #35）。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectClassRequest'
      responses:
        '200':
          description: 選擇成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: 非真劍勝負房間 / Ready 後職業已鎖定
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /rooms/{roomId}/actions/toggle-ready:
    post:
      tags: [rooms]
      operationId: toggleReady
      summary: 切換 Ready 狀態
      description: >
        切換自己的 Ready；兩名對戰玩家皆 Ready 觸發開局。對應 PlayerReadyToggled / AllPlayersReady。
        僅 role=PLAYER 可操作，觀戰者呼叫回 403（Q5）。
        Bug fix（additive）：房間狀態非 WAITING/READY（即對局已開始 IN_PROGRESS 或已結束
        FINISHED）時回 422 ——對局結束時房間會自動轉為 FINISHED（見 GameService
        closeRoomIfOnline），避免已結束房間的 Ready 仍可被切換而弄亂狀態。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 切換成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RoomDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            房間狀態不可切換 Ready（Bug fix，additive）：房間已進入 IN_PROGRESS 或 FINISHED。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      code: { type: string, example: "422001" }
                      data: { type: object }

  /rooms/{roomId}/actions/start-game:
    post:
      tags: [rooms]
      operationId: startGame
      summary: 開局（雙方 Ready 後）
      description: >
        兩名對戰玩家皆 Ready 後觸發開局，建立對局並將房間狀態轉為 IN_PROGRESS；
        真劍勝負模式此時揭曉雙方職業（ClassesRevealed，Q8）。對應 AllPlayersReady /
        線上版 GameStarted 事件。
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: 對局已建立
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 尚有玩家未 Ready 或對戰席未滿 2 人
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /games:
    post:
      tags: [games]
      operationId: startLocalGame
      summary: 開始本地遊戲
      description: 建立本地對局，可選 useSwap2（假先方系統隨機）。對應 LocalGameStarted。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalGameCreateRequest'
      responses:
        '201':
          description: 建立成功
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /games/{gameId}:
    get:
      tags: [games]
      operationId: getGameState
      summary: 查詢對局目前狀態
      description: >
        供斷線重連使用：回傳當前對局完整狀態，含真劍勝負技能已使用狀態與場地狀態
        （障礙物、侵蝕進度等）一併恢復，沿用既有重連機制（需求 #46）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{gameId}/actions/coin-toss:
    post:
      tags: [games]
      operationId: tossCoin
      summary: 投擲硬幣
      description: 後端決定硬幣結果；普通模式定黑白、Swap2 定假先方。對應 CoinTossCompleted。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 投擲完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoinTossResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{gameId}/moves:
    post:
      tags: [games]
      operationId: placeMove
      summary: 落子
      description: >
        伺服器權威驗證落子（位置合法、輪次、勝負）。對應 MovePlaced / WinConditionMet /
        GameDraw / InvalidMoveRejected。線上模式驗證後經 STOMP 廣播。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCreateRequest'
      responses:
        '201':
          description: 落子成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            落子不合法（非當前回合 / 位置已佔 / 超出棋盤 / 障礙物格禁止落子 /
            技能已使用過 / 大絕與落子/一般技能同時提出 / 大絕錨點非空格 /
            散射兩子距離不足 / 精準狙擊目標非現存敵方棋子）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        type: object

  /games/{gameId}/opening-stones:
    post:
      tags: [games]
      operationId: placeOpeningStone
      summary: Swap2 開局放置
      description: 假先方放置開局子（每子確認）。僅假先方可操作。對應 OpeningStonePlaced。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningStoneCreateRequest'
      responses:
        '201':
          description: 放置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /games/{gameId}/opening-stones/actions/undo-last:
    post:
      tags: [games]
      operationId: undoLastOpeningStone
      summary: 悔開局最後一子
      description: 僅允許移除最後放置的開局子（需求 #31）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已移除最後一子
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /games/{gameId}/actions/swap2-choice:
    post:
      tags: [games]
      operationId: makeSwap2Choice
      summary: Swap2 假後方選擇
      description: 假後方三選一，定案最終黑白與輪次。對應 Swap2ChoiceMade / ColorAssignmentFinalized / OpeningCompleted。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Swap2ChoiceRequest'
      responses:
        '200':
          description: 選擇完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameStateResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /games/{gameId}/actions/rematch:
    post:
      tags: [games]
      operationId: rematchGame
      summary: 再戰
      description: 本地重置（保留名稱）或線上重新開局（需求 #12 #14）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: 新局已建立
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameDetailResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /games/{gameId}/replay:
    get:
      tags: [history]
      operationId: getGameReplay
      summary: 取得對局回放
      description: 回傳完整落子序列（含 openingStones）供重播（需求 #17 #32）。
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GameReplayResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  # ── PVE 挑戰模式（documents/PVE-挑戰模式-增量需求.md）─────────
  /pve/runs:
    post:
      tags: [pve]
      operationId: createPveRun
      summary: 建立挑戰 Run
      description: >
        選擇職業後建立一輪新 Run，同時建立第一關（FR-B1 FR-C1 FR-C8）。同一帳號同時
        至多 1 個進行中的 Run；已有進行中 Run 時回 422（FR-C8）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PveRunCreateRequest'
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveRunStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: 已存在進行中的 Run，需先結束（通關/失敗/放棄）才能建立新 Run（FR-C8）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /pve/runs/current:
    get:
      tags: [pve]
      operationId: getCurrentPveRun
      summary: 查詢目前進行中的 Run
      description: 供斷線/重新整理後續玩（FR-B6 FR-C8）；含目前關卡、持有技能/遺物、金幣。
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveRunStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pve/runs/{runId}/actions/abandon:
    post:
      tags: [pve]
      operationId: abandonPveRun
      summary: 放棄 Run
      description: 玩家主動放棄，視同失敗；回傳 Run 結算資料（FR-C7）。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已放棄
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveRunResultResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /pve/runs/{runId}/result:
    get:
      tags: [pve]
      operationId: getPveRunResult
      summary: 查詢已結束 Run 的權威結算
      description: >
        Run 因通過第8關（WON）或任一關手數用盡失敗（LOST）而自然結束時，前端無法像
        abandon／shop 通關後skip（第8關）那樣直接從觸發動作的當下回應取得
        PveRunResultResponse——本端點供事後查詢該次結算，回傳權威 goldEarned/
        goldSpent/totalDamageDealt，取代前端自行以 sessionStorage 推算（FR-C7）。
        僅限已結束（WON/LOST/ABANDONED）的 Run 可查；Run 仍進行中則回 422，
        請待通關/失敗/放棄後再查詢。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveRunResultResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Run 仍進行中，尚未結束，無法查詢結算
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /pve/encounters/{encounterId}:
    get:
      tags: [pve]
      operationId: getPveEncounter
      summary: 查詢關卡狀態
      description: 供續玩恢復（FR-B6），回傳 Boss HP、剩餘手數、場地狀態、已使用技能。
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveEncounterStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pve/encounters/{encounterId}/moves:
    post:
      tags: [pve]
      operationId: placePveMove
      summary: 關卡落子
      description: >
        伺服器權威驗證落子並結算連線傷害（FR-B2 FR-B3 FR-B4）。一手最多 4 方向同時
        結算多條線，各自計傷、共用棋子僅移除一次。結算後立即判定關卡勝敗；Boss HP<=0
        時立即結束、不再接受落子。回應 P95 < 500ms（NFR-2）。
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PveMoveCreateRequest'
      responses:
        '201':
          description: 落子成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveEncounterStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            落子不合法（非本人關卡 / 位置已佔 / 超出11x11範圍 / 障礙格禁止落子 /
            手數已用盡 / 關卡已結束）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /pve/encounters/{encounterId}/actions/use-skill:
    post:
      tags: [pve]
      operationId: usePveSkill
      summary: 使用技能
      description: >
        PVE 技能一律獨立行動、消耗型：不落子、不消耗手數（FR-A2 FR-B5）。僅能於任兩次
        落子之間（含第一次落子前）使用，每個間隔至多 1 個；第30手落子結算完成後不可再用。
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PveSkillUseRequest'
      responses:
        '201':
          description: 使用成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveEncounterStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >
            使用不合法（未持有該技能 / 本間隔已使用過技能 / 關卡已結束 /
            大絕錨點非空格 / 精準狙擊目標非現存敵方棋子 / 散射兩子距離不足）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /pve/encounters/{encounterId}/actions/retry:
    post:
      tags: [pve]
      operationId: retryPveEncounter
      summary: 重試和局的魔王對弈關（DUEL限定）
      description: >
        2026-07-09 新增（documents/PVE-魔王對弈與策略引導設計-2026-07-09.md §1.5/§6.5
        公平性修正）：關卡狀態為 DRAW（DUEL限定——手數耗盡且雙方皆未連五）時可呼叫，
        原地重開同一關（同sequence），盤面重新開始、Boss AI RNG重新播種，Run本身
        不受影響（不沒收、不計敗、可無限次重試）。回傳新的
        PveEncounterStateResponse（新 encounterId，舊的失效）。
      parameters:
        - name: encounterId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: 重試成功，回傳新關卡狀態
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveEncounterStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 關卡非DUEL類型 / 關卡狀態非DRAW
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /pve/runs/{runId}/shop:
    get:
      tags: [pve]
      operationId: getPveShop
      summary: 查詢商店展示
      description: 通過一關後開啟；固定展示遺物x2、技能x1（FR-C4）。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 查詢成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveShopStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pve/runs/{runId}/shop/actions/purchase:
    post:
      tags: [pve]
      operationId: purchasePveShopOffer
      summary: 購買商店展示品
      description: 依 slotIndex 購買遺物或技能；金幣不足、已達持有上限（遺物5/技能3）時回 422（FR-C4）。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PveShopPurchaseRequest'
      responses:
        '200':
          description: 購買成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveShopStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /pve/runs/{runId}/shop/actions/reroll:
    post:
      tags: [pve]
      operationId: rerollPveShop
      summary: 重抽商店展示
      description: 三個展示位全部重新抽取；固定花費5金幣，次數不限，僅受金幣限制（FR-C4）。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 重抽成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PveShopStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 金幣不足（FR-C4）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }

  /pve/runs/{runId}/shop/actions/skip:
    post:
      tags: [pve]
      operationId: skipPveShop
      summary: 跳過商店
      description: 不購買，直接進入下一關；第8關通關後無商店，直接 Run 結算（FR-C4 FR-C7）。
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >
            已跳過。若下一關存在則回傳下一關狀態（data 為 PveEncounterStateResponse）；
            若剛通過第8關則回傳 Run 結算（data 為 PveRunResultResponse）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ManageResponse'
                  - type: object
                    properties:
                      data: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

components:
  schemas:
    ManageResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        code:
          type: string
          example: "200000"
        message:
          type: string
          example: OK

    ManagePageResponse:
      type: object
      properties:
        items:
          type: array
          items: {}
        totalCount:
          type: integer
          example: 100

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: carol }
        email: { type: string, format: email, example: carol@example.com }
        password:
          type: string
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*\d).{8,}$'
          example: "P@ssw0rd1"
          description: '最短 8 碼，須同時含英文小寫字母與數字；允許大小寫/數字/符號（Q3）'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: alice }
        password: { type: string, example: "P@ssw0rd1" }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: JWT }
        playerId: { type: string, example: "p-001" }

    GuestEnterRequest:
      type: object
      required: [nickname]
      properties:
        nickname: { type: string, example: "路人甲" }

    GuestEnterResponse:
      type: object
      properties:
        guestId: { type: string, example: "g-abc" }
        nickname: { type: string, example: "路人甲" }

    PlayerDetailResponse:
      type: object
      properties:
        playerId: { type: string }
        username: { type: string }
        email: { type: string }

    PlayerStatsResponse:
      type: object
      properties:
        playerId: { type: string }
        wins: { type: integer, example: 8 }
        losses: { type: integer, example: 2 }
        draws: { type: integer, example: 0, description: '和局數（含雙方同時斷線判和）' }
        winRate: { type: number, format: float, example: 0.80 }
        recentGames:
          type: array
          items:
            $ref: '#/components/schemas/RecentGameItem'

    RecentGameItem:
      type: object
      properties:
        gameId: { type: string }
        result: { type: string, enum: [BLACK_WIN, WHITE_WIN, DRAW] }
        endedAt: { type: string, example: "2026-05-24T12:00:00+08:00" }

    LeaderboardEntryResponse:
      type: object
      description: '排序：wins DESC 為主、winRate DESC 為次；僅含 wins+losses>=10 的玩家（Q2）'
      properties:
        rank: { type: integer, example: 1 }
        playerId: { type: string }
        username: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number, format: float }

    RoomCreateRequest:
      type: object
      required: [visibility]
      properties:
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        isSwap2Mode: { type: boolean, default: false }
        battleMode:
          type: string
          enum: [NORMAL, SERIOUS_DUEL]
          default: NORMAL
          description: '真劍勝負模式；與 isSwap2Mode=true 互斥，同時指定回 422（需求 #34，Q9）'
        fieldType:
          type: string
          enum: [VOLCANO, BEACH]
          nullable: true
          description: 'battleMode=SERIOUS_DUEL 時必填；否則須為 null（需求 #34）'

    SelectClassRequest:
      type: object
      required: [classType]
      properties:
        classType: { type: string, enum: [WARRIOR, ARCHER] }

    RoomDetailResponse:
      type: object
      properties:
        roomId: { type: string }
        roomCode: { type: string, example: ABC123 }
        visibility: { type: string, enum: [PUBLIC, PRIVATE] }
        status: { type: string, enum: [WAITING, READY, IN_PROGRESS, FINISHED] }
        isSwap2Mode: { type: boolean }
        battleMode: { type: string, enum: [NORMAL, SERIOUS_DUEL] }
        fieldType: { type: string, enum: [VOLCANO, BEACH], nullable: true }
        joinedAsRole:
          type: string
          enum: [PLAYER, SPECTATOR]
          nullable: true
          description: '本次加入後當前使用者的角色（joinRoom 回應用）'
        spectatorCount: { type: integer, example: 0, description: '觀戰席人數' }
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoomMemberItem'

    RoomMemberItem:
      type: object
      properties:
        playerId: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [PLAYER, SPECTATOR], description: 'PLAYER=對戰席 / SPECTATOR=觀戰席' }
        isReady: { type: boolean, description: '觀戰席恆 false' }
        classType:
          type: string
          enum: [WARRIOR, ARCHER]
          nullable: true
          description: >
            真劍勝負模式限定。己方 response 顯示實際選擇；對手於選擇階段（未 ClassesRevealed 前）
            顯示 null（Q8 不可見規則，僅適用於對戰雙方彼此之間），對局開始揭曉後雙方皆可見。
            觀戰者（role=SPECTATOR）視角不受此限制：任何階段皆可見雙方實際 classType 與
            技能使用狀態（R2-2）；但場地隱藏格資訊仍與玩家視角相同、觀戰者同樣不可見
            （見 GameStateResponse.revealedHiddenCells，需求 #44）。

    RoomListResponse:
      type: object
      properties:
        roomId: { type: string }
        roomCode: { type: string }
        hostNickname: { type: string }
        playerCount: { type: integer, description: '對戰席人數（0..2）' }
        spectatorCount: { type: integer, description: '觀戰席人數' }
        isSwap2Mode: { type: boolean }
        battleMode: { type: string, enum: [NORMAL, SERIOUS_DUEL] }
        fieldType: { type: string, enum: [VOLCANO, BEACH], nullable: true }

    QuickMatchResponse:
      type: object
      properties:
        matched: { type: boolean }
        roomId: { type: string, nullable: true }
        queuePosition: { type: integer, nullable: true }

    LocalGameCreateRequest:
      type: object
      required: [useSwap2]
      properties:
        useSwap2: { type: boolean, default: false }
        blackNickname: { type: string, example: "甲" }
        whiteNickname: { type: string, example: "乙" }

    GameDetailResponse:
      type: object
      properties:
        gameId: { type: string }
        gameMode: { type: string, enum: [LOCAL, ONLINE] }
        useSwap2: { type: boolean }
        battleMode: { type: string, enum: [NORMAL, SERIOUS_DUEL] }
        fieldType: { type: string, enum: [VOLCANO, BEACH], nullable: true }
        status: { type: string, enum: [OPENING, PLAYING, FINISHED] }
        currentTurn: { type: string, enum: [BLACK, WHITE], nullable: true }

    CoinTossResponse:
      type: object
      properties:
        gameId: { type: string }
        coinResult: { type: string, enum: [HEADS, TAILS] }
        tentativeFirstPlayerId: { type: string, nullable: true, description: Swap2 假先方 }
        blackPlayerId: { type: string, nullable: true }
        whitePlayerId: { type: string, nullable: true }

    MoveCreateRequest:
      description: >
        以 oneOf 拆兩分支，恢復 schema 層必填保障（需求 #36）：
        一般落子（含普通模式）/ 真劍勝負一般技能附掛落子 → MoveCreateRequestNormal（row/col 必填）；
        真劍勝負大絕施法（取代本回合落子）→ MoveCreateRequestUltimate（僅 skill 必填、
        skill.anchor 必填、禁止同時提供 row/col）。若請求同時滿足/都不滿足兩分支條件，
        oneOf 驗證失敗（即 row/col 與大絕 skill 同時提出時兩分支互斥失敗）。
        真劍勝負模式棋盤範圍依場地而異：火山 0..14、沙灘 0..15（需求 #39 #40）；
        row/col 的 schema `maximum: 15` 為兩場地「聯集」上界，僅作 schema 層粗界防呆，
        實際上界依 fieldType 收斂（火山最大 14、沙灘最大 15），backend 必依 fieldType
        再次驗證，超出該場地實際邊界一律回 422（UnprocessableEntity）。
      oneOf:
        - $ref: '#/components/schemas/MoveCreateRequestNormal'
        - $ref: '#/components/schemas/MoveCreateRequestUltimate'

    MoveCreateRequestNormal:
      type: object
      required: [row, col]
      description: '一般落子（含普通模式）或真劍勝負一般技能（附掛於本手落子，需求 #36）'
      properties:
        row: { type: integer, minimum: 0, maximum: 15, example: 7 }
        col: { type: integer, minimum: 0, maximum: 15, example: 7 }
        skill:
          $ref: '#/components/schemas/SkillActionRequest'

    MoveCreateRequestUltimate:
      type: object
      required: [skill]
      description: '真劍勝負大絕施法，取代本回合落子；不得同時提供 row/col（需求 #36）'
      not:
        anyOf:
          - required: [row]
          - required: [col]
      properties:
        skill:
          allOf:
            - $ref: '#/components/schemas/SkillActionRequest'
            - type: object
              required: [anchor]
              properties:
                skillType: { type: string, enum: [HEAVEN_EARTH_REVERSAL, PIONEER_STAR] }

    SkillActionRequest:
      type: object
      required: [skillType]
      description: >
        技能發動的共用欄位結構，跨模式共用（真劍勝負 PVP：需求 #36 #42 #43；PVE 挑戰
        模式：FR-A2 FR-B5）。欄位定義兩模式相同，但「行動型態」（附掛於落子／取代落子／
        獨立行動）與「使用限制」（每場一次／消耗型）由 FR-A2 資料定義依模式切換，不
        寫死於本 schema：PVP 一般技能（HORIZONTAL_SLASH/VERTICAL_SLASH/PRECISION_SNIPE/
        SCATTER_SHOT）附掛於本手落子（MoveCreateRequestNormal.row/col 即該手落子座標）
        同時提出，大絕（HEAVEN_EARTH_REVERSAL/PIONEER_STAR）取代本回合落子
        （MoveCreateRequestUltimate，此時省略 row/col），每個技能一場僅能使用一次；
        PVE 全部技能皆為獨立行動、消耗型，透過 PveSkillUseRequest 單獨送出、不附掛
        任何落子座標，使用限制改依持有數量（上限3）與每兩次落子間至多用1個
        （FR-B5）。因 PVE 無伴隨落子座標，下列 anchor/target/secondStone 部分欄位在
        PVE 情境下承載的座標角色與 PVP 不同，各欄位 description 已分別註明。
      properties:
        skillType:
          type: string
          enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]
        direction:
          type: string
          enum: [UP, DOWN, LEFT, RIGHT]
          nullable: true
          description: '橫劈用 UP/DOWN；縱劈用 LEFT/RIGHT；大絕四方向皆可（PVP/PVE 通用）'
        anchor:
          type: object
          nullable: true
          description: >
            大絕（HEAVEN_EARTH_REVERSAL/PIONEER_STAR）：施法錨點，PVP/PVE 皆須為空格，
            錨點本身不落子，僅界定3x2共6格作用區（需求 #42 #43，FR-A2）。
            橫劈/縱劈（HORIZONTAL_SLASH/VERTICAL_SLASH）：推擠參考格。PVP 由本手
            row/col 帶入（先落子、後以該落子點為參考推擠，本欄位不使用）；PVE 因技能
            為獨立行動、無伴隨落子，改由本欄位提供參考格座標，該格本身不因此落子，
            可為空格或現有棋子（FR-A2 FR-B5）。
            散射（SCATTER_SHOT）：PVP 由本手 row/col 作為第一顆棋子座標（本欄位不使用）；
            PVE 因無伴隨落子，改由本欄位作為第一顆新棋子座標，與 secondStone 的
            Chebyshev 距離規則不變。
          properties:
            row: { type: integer }
            col: { type: integer }
        target:
          type: object
          nullable: true
          description: >
            精準狙擊（PRECISION_SNIPE）指定的『現存敵方棋子』座標。PVP：現存敵方棋子＝
            對手顏色棋子，且必須與本手 row/col 一致（本欄位為選填防呆確認，實際作用
            座標仍是 row/col）。PVE：無真人對手、技能為獨立行動無伴隨落子，故本欄位
            為必填、直接代表作用座標；PVE 的『現存敵方棋子』定義為深淵突變（第8關
            ABYSS，FR-C6）動態生成之障礙棋子（棋盤上以白子表示），命中後轉為玩家棋子；
            座標上無此棋子時回 422「精準狙擊目標非現存敵方棋子」。
          properties:
            row: { type: integer }
            col: { type: integer }
        secondStone:
          type: object
          nullable: true
          description: >
            散射（SCATTER_SHOT）第二顆棋子座標，與第一顆座標的 Chebyshev 距離須 >= 2、
            兩格皆須為空格可落子。PVP 第一顆座標＝本手 row/col；PVE 第一顆座標＝本
            schema 的 anchor 欄位（因技能獨立行動、無伴隨落子座標）。
          properties:
            row: { type: integer }
            col: { type: integer }

    GameStateResponse:
      type: object
      description: >
        真劍勝負限定欄位（blackClass/whiteClass/fieldState/skillEvents 等）對觀戰者與
        玩家一致可見（R2-2）；唯隱藏格資訊（未觸發的 ERUPTION/TIDE）統一對所有視角不可見，
        僅 revealedHiddenCells 揭露已觸發者（需求 #44）。
      properties:
        gameId: { type: string }
        status: { type: string, enum: [OPENING, PLAYING, FINISHED] }
        currentTurn: { type: string, enum: [BLACK, WHITE], nullable: true }
        moveCount: { type: integer }
        lastMove:
          type: object
          nullable: true
          properties:
            color: { type: string, enum: [BLACK, WHITE] }
            row: { type: integer }
            col: { type: integer }
        result: { type: string, enum: [BLACK_WIN, WHITE_WIN, DRAW], nullable: true }
        winningLine:
          type: array
          nullable: true
          items:
            type: object
            properties:
              row: { type: integer }
              col: { type: integer }
        blackClass: { type: string, enum: [WARRIOR, ARCHER], nullable: true, description: '真劍勝負：games.status 轉為 PLAYING（即 ClassesRevealed 觸發時點）前為 null（需求 #35）' }
        whiteClass: { type: string, enum: [WARRIOR, ARCHER], nullable: true, description: '真劍勝負：games.status 轉為 PLAYING 前為 null（需求 #35）' }
        fieldState:
          type: object
          nullable: true
          description: '真劍勝負限定；隱藏格（未觸發的 ERUPTION/TIDE）不含在 obstacles/revealedHiddenCells 之外（需求 #44）'
          properties:
            fieldType: { type: string, enum: [VOLCANO, BEACH] }
            obstacles:
              type: array
              description: '火山障礙物格，雙方可見（需求 #39）'
              items:
                type: object
                properties:
                  row: { type: integer }
                  col: { type: integer }
            seaSide:
              type: string
              enum: [NORTH, SOUTH, EAST, WEST]
              nullable: true
              description: '沙灘場地海洋起始側（開局隨機決定，僅 fieldType=BEACH 有值；需求 #40）'
            erodedRows: { type: integer, description: '沙灘已侵蝕排數（需求 #41）' }
            tideTriggered: { type: boolean }
            roundCounter: { type: integer, description: '海浪回合計數（每5輪/10手觸發一次）' }
        revealedHiddenCells:
          type: array
          description: '本次結算中新觸發、因而揭露的噴發/漲潮格（需求 #44）'
          items:
            type: object
            properties:
              cellKind: { type: string, enum: [ERUPTION, TIDE] }
              row: { type: integer }
              col: { type: integer }
        skillEvents:
          type: array
          description: '本回合結算產生的技能/場地事件，供前端特效觸發（需求 #37 #38 #45）'
          items:
            type: object
            properties:
              eventType:
                type: string
                enum: [FIELD_GENERATED, STONE_PUSHED, STONE_REMOVED_OFF_BOARD, STONES_BURNED, STONE_REPLACED, STONES_CLEARED, COLORS_SWAPPED, VOLCANO_ERUPTED, WAVE_SURGED, TIDE_TRIGGERED, TIDE_RISEN, SAND_ERODED]
              row: { type: integer, nullable: true }
              col: { type: integer, nullable: true }
              effectTriggered: { type: boolean, example: true, description: '特效觸發旗標，動畫實作留待 UI 設計階段（R2-1）' }
        stones:
          type: array
          nullable: true
          description: '權威全盤快照：所有佔據格的棋子位置。客戶端應以此為準渲染盤面；skillEvents 僅供特效觸發（需求 #45）。真劍勝負限定；NORMAL 對局傳送 null'
          items:
            type: object
            properties:
              row: { type: integer }
              col: { type: integer }
              color: { type: string, enum: [BLACK, WHITE] }
        skillType:
          type: string
          enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]
          nullable: true
          description: >
            （additive bug fix，2026-07-07）本手結算所附掛/施放的技能型別。供 STOMP
            廣播端（對手/觀戰者）直接得知技能、觸發對應動畫與提示——先前僅靠
            skillEvents 推斷：劈砍會因 STONE_PUSHED 的 row/col 是推擠「目的格」
            （距落子 2 格）而推斷失敗，散射則完全無事件特徵可推斷（需求 #45、R2-1）。
            本手無技能、NORMAL 對局、或 GET 讀取快照（無單手脈絡）時為 null。

    OpeningStoneCreateRequest:
      type: object
      required: [row, col, color]
      properties:
        row: { type: integer, minimum: 0, maximum: 14 }
        col: { type: integer, minimum: 0, maximum: 14 }
        color: { type: string, enum: [BLACK, WHITE] }

    Swap2ChoiceRequest:
      type: object
      required: [choice]
      properties:
        choice: { type: string, enum: [TAKE_BLACK, TAKE_WHITE, PLACE_TWO_MORE] }

    GameReplayResponse:
      type: object
      properties:
        gameId: { type: string }
        result: { type: string, enum: [BLACK_WIN, WHITE_WIN, DRAW] }
        winnerPlayerId: { type: string, nullable: true }
        moveCount: { type: integer }
        useSwap2: { type: boolean }
        currentTurn:
          type: string
          enum: [BLACK, WHITE]
          nullable: true
          description: '（additive bug fix）回放/重連時權威的「輪到誰」，moveCount 奇偶不可靠（真劍勝負大招 0 手、散射一手 2 子）；FINISHED 後為 null'
        battleMode: { type: string, enum: [NORMAL, SERIOUS_DUEL] }
        fieldType: { type: string, enum: [VOLCANO, BEACH], nullable: true }
        blackClass: { type: string, enum: [WARRIOR, ARCHER], nullable: true }
        whiteClass: { type: string, enum: [WARRIOR, ARCHER], nullable: true }
        fieldEvents:
          type: array
          description: '真劍勝負：技能/場地事件序列，含隱藏格觸發時點；賽後回放可完整重現並可揭露隱藏格（需求 #47）'
          items:
            type: object
            properties:
              # Additive bug fix: FIELD_GENERATED happens at game build time
              # (before any move), so the real backend sends moveNumber:null
              # for it (mirrors erm.dbml field_events.move_number, nullable).
              moveNumber: { type: integer, nullable: true }
              eventType:
                type: string
                enum: [FIELD_GENERATED, STONE_PUSHED, STONE_REMOVED_OFF_BOARD, STONES_BURNED, STONE_REPLACED, STONES_CLEARED, COLORS_SWAPPED, VOLCANO_ERUPTED, WAVE_SURGED, TIDE_TRIGGERED, TIDE_RISEN, SAND_ERODED]
              row: { type: integer, nullable: true }
              col: { type: integer, nullable: true }
        skillUsages:
          type: array
          description: '（additive bug fix）每位玩家的已用技能歷史，供重連時還原前端 client-side 追蹤的 usedSkills 狀態（R2-3）；NORMAL 模式為空陣列或省略'
          items:
            type: object
            properties:
              playerId: { type: string }
              skillType:
                type: string
                enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]
        obstacles:
          type: array
          description: '（additive bug fix）火山障礙物 / 沙灘地形快照，鏡射 GameStateResponse.fieldState.obstacles；fieldEvents 的 FIELD_GENERATED 事件 row/col 皆為 null，無法單靠事件序列還原場地。NORMAL 模式為空陣列或省略'
          items:
            type: object
            properties:
              row: { type: integer }
              col: { type: integer }
        seaSide:
          type: string
          enum: [NORTH, SOUTH, EAST, WEST]
          nullable: true
          description: '（additive bug fix）沙灘場地海洋起始側，鏡射 GameStateResponse.fieldState.seaSide；僅 fieldType=BEACH 有值，NORMAL 模式為 null'
        openingStones:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer }
              color: { type: string, enum: [BLACK, WHITE] }
              row: { type: integer }
              col: { type: integer }
        moves:
          type: array
          items:
            type: object
            properties:
              moveNumber: { type: integer }
              color: { type: string, enum: [BLACK, WHITE] }
              row: { type: integer }
              col: { type: integer }

    # ── PVE 挑戰模式 Schemas（documents/PVE-挑戰模式-增量需求.md）─
    PveRunCreateRequest:
      type: object
      required: [classType]
      properties:
        classType: { type: string, enum: [WARRIOR, ARCHER], description: 'FR-B1：建關依職業附贈1個技能（WARRIOR附HORIZONTAL_SLASH／ARCHER附PRECISION_SNIPE，FR-B5）' }
        seed:
          type: string
          nullable: true
          maxLength: 64
          example: "determinism-test-001"
          description: >
            選填，供決定性測試/問題重現注入固定 seed（FR-A3：同 seed＋同操作序列必得
            同結果，驅動場地生成、隱藏格位置、Boss突變隨機事件、商店抽取等）。
            省略或空白時由伺服器自動產生亂數 seed，一般玩家建立 Run 不需提供。

    PveRunStateResponse:
      type: object
      description: 'Run 全貌：目前關卡、金幣、持有技能/遺物（FR-B6 FR-C8）'
      properties:
        runId: { type: string }
        classType: { type: string, enum: [WARRIOR, ARCHER] }
        status: { type: string, enum: [IN_PROGRESS, WON, LOST, ABANDONED] }
        gold: { type: integer, example: 30, description: 'Run內貨幣，不跨Run累積（FR-C3）' }
        currentEncounterSequence: { type: integer, example: 1, minimum: 1, maximum: 8 }
        reachedEncounterSequence: { type: integer, example: 0 }
        totalDamageDealt: { type: integer, example: 0 }
        currentEncounter:
          $ref: '#/components/schemas/PveEncounterStateResponse'
        heldSkills:
          type: array
          description: '持有上限3（含重複），FR-C4'
          items:
            type: object
            properties:
              skillType: { type: string, enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR] }
              quantity: { type: integer, example: 1 }
        heldRelics:
          type: array
          description: '持有上限5，不可重複（FR-C4）'
          items:
            type: object
            properties:
              relicType:
                type: string
                enum: [SHARP_BLADE, CHAIN_CORE, DIAGONAL_WALKER, VOLCANO_HEART, TIDE_BREAKWATER, METRONOME, RECYCLER, GEMINI_STAR]

    PveEncounterStateResponse:
      type: object
      description: 供關卡對局頁渲染與續玩恢復（FR-B6）
      properties:
        encounterId: { type: string }
        runId: { type: string }
        sequence: { type: integer, example: 1, minimum: 1, maximum: 8 }
        fieldType: { type: string, enum: [PLAIN, VOLCANO, BEACH], description: 'PVE專用11x11幾何規格，與真劍勝負場地不共用尺寸（FR-C2）；DUEL關（第4/8關）固定PLAIN' }
        mutationType: { type: string, enum: [NONE, ONE_EYE, RAGE, ABYSS], description: '固定綁定第3/6關（FR-C6）；DUEL關（第4/8關）固定NONE，ABYSS已隨2026-07-09魔王對弈改版retired（無任何關卡使用）' }
        encounterType:
          type: string
          enum: [PUZZLE, DUEL]
          description: >
            2026-07-09 新增（documents/PVE-魔王對弈與策略引導設計-2026-07-09.md §1.0/§5.1）:
            PUZZLE（第1/2/3/5/6/7關，預放黑棋雛形+補完消線）或 DUEL（第4/8關固定，
            魔王對弈——玩家黑子先手、Boss白子後手交替落子，玩家連五過關、Boss
            連五或手數用盡敗，無BossHP/傷害/場地突變概念）。前端須依此欄位切換
            渲染：DUEL不顯示HP條，改顯示手數/回合提示。
        boardRows: { type: integer, example: 11 }
        boardCols: { type: integer, example: 11 }
        bossHpMax: { type: integer, example: 100, description: 'DUEL關固定為0（無HP概念，前端不應渲染HP條，見encounterType）' }
        bossHpCurrent: { type: integer, example: 100, description: 'DUEL關固定為0' }
        moveBudget: { type: integer, example: 30, description: 'DUEL關為玩家自己手數的預算，Boss回手不佔用此配額（第4關45／第8關70，§1.7起始值經§4統計驗收後之實作校準值）' }
        movesUsed: { type: integer, example: 0 }
        status:
          type: string
          enum: [IN_PROGRESS, CLEARED, FAILED, DRAW]
          description: >
            DRAW（2026-07-09新增，documents/PVE-魔王對弈與策略引導設計-2026-07-09.md
            §1.5/§6.5 公平性修正）：DUEL限定——手數耗盡且雙方皆未連五，與FAILED不同，
            不沒收Run（Run仍IN_PROGRESS），前端應顯示「勢均力敵！再來一局」並呼叫
            retryPveEncounter原地重試（可無限次），不導向結算頁。
        stones:
          type: array
          description: '權威全盤快照（同真劍勝負 GameStateResponse.stones 慣例）；DUEL關為玩家黑子'
          items:
            type: object
            properties:
              row: { type: integer }
              col: { type: integer }
        obstacles:
          type: array
          description: 'VOLCANO可見障礙格3–5個；PUZZLE關的ABYSS突變動態生成障礙棋子（已retired）；DUEL關的Boss白子（kind=ENEMY_STONE）亦列於此（FR-C2 FR-C6，2026-07-09擴充）'
          items:
            type: object
            properties:
              row: { type: integer }
              col: { type: integer }
              kind:
                type: string
                enum: [ROCK, ENEMY_STONE]
                description: >
                  2026-07-09 新增（additive，舊consumer可忽略此欄位）：ROCK＝
                  VOLCANO障礙／PUZZLE關ABYSS障礙棋子（前端沿用既有岩石圖示）；
                  ENEMY_STONE＝DUEL關Boss活棋（前端須改走一般雙色棋子渲染，
                  不可用岩石圖示，見§5.2）。
        skillUsableThisInterval:
          type: boolean
          description: '本間隔（上一手落子後、下一手落子前）是否仍可使用技能，每間隔至多1個（FR-B5）'
        usedSkills:
          type: array
          description: >
            本關「玩家」已使用技能清單（依使用順序，可含重複；FR-B7 關卡結算畫面
            顯示用，斷線續玩查詢時同步回傳，FR-B6）。本關總傷害可由
            bossHpMax-bossHpCurrent 推算，剩餘手數可由 moveBudget-movesUsed 推算，
            皆無需新增欄位。**bug fix（2026-07-10）**：此欄位現在只含玩家自己的施
            放紀錄——舊版曾把 L8 SKILL_DEMON 的 Boss 施法也併入同一份清單、前端無
            從分辨，見下方 bossUsedSkills。
          items:
            type: string
            enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]
        lastResolution:
          type: object
          nullable: true
          description: '最近一次落子/技能結算結果，供傷害數字與特效觸發（FR-B2 FR-B3）'
          properties:
            damageDealt: { type: integer, example: 90 }
            linesResolved:
              type: array
              items:
                type: object
                properties:
                  length: { type: integer, example: 7, description: '線長，5以上；六連以上見需求文件§5 FR-B3成因說明' }
                  baseScore: { type: integer, example: 90 }
                  multiplier: { type: number, format: float, example: 1.0 }
                  direction: { type: string, enum: [HORIZONTAL, VERTICAL, DIAGONAL, ANTI_DIAGONAL] }
        events:
          type: array
          description: '本次結算事件，供特效觸發（同真劍勝負 skillEvents 慣例）'
          items:
            type: object
            properties:
              eventType:
                type: string
                enum: [LINE_RESOLVED, SKILL_USED, STONES_PUSHED, STONE_REMOVED_OFF_BOARD, VOLCANO_ERUPTED, WAVE_SURGED, TIDE_TRIGGERED, BOSS_MUTATION_TRIGGERED, BOSS_MOVE_PLACED, ENCOUNTER_CLEARED, ENCOUNTER_FAILED, ENCOUNTER_DRAWN]
                description: >
                  BOSS_MOVE_PLACED（2026-07-09新增，additive）：DUEL關（第4/8關）
                  專用，Boss每回應一手即發布一次，row/col為Boss落子座標——前端
                  用於短暫高亮「Boss剛下的這一手」動畫（複用highlight機制，§5.2）。
                  ENCOUNTER_DRAWN（2026-07-09新增，additive，§1.5/§6.5）：DUEL關
                  限定，手數耗盡且雙方皆未連五時發布，對應 status=DRAW（見上方
                  status 欄位說明）。
              row: { type: integer, nullable: true }
              col: { type: integer, nullable: true }
        horizontalDisabled:
          type: boolean
          default: false
          description: >
            2026-07-10 新增（additive，documents/PVE-全對弈階梯設計-2026-07-10.md
            §4.1）：L3限定「不可橫向」——true時橫向連五不算勝（雙方對稱，全遊戲
            僅此關）。前端應顯示提示（本關橫向連五不算勝）。
        bossSkillEvents:
          type: array
          description: >
            2026-07-10 新增（additive，§3/§9.2）：L8 SKILL_DEMON限定，本次結算內
            Boss施放的弓箭手技能（精準狙擊/散射/開拓之星，各僅一次charge），供
            前端播放「這是Boss施法」的動畫變體，與玩家自己施法的既有動畫路徑
            區分。cells為該技能影響的座標：精準狙擊=1格（轉為Boss棋子）、
            散射=2格（新落的Boss棋子）、開拓之星=清除範圍內所有棋子座標。
          items:
            type: object
            properties:
              skillType:
                type: string
                enum: [PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]
              cells:
                type: array
                items:
                  type: object
                  properties:
                    row: { type: integer }
                    col: { type: integer }
        bossUsedSkills:
          type: array
          description: >
            2026-07-10 新增（additive，bug fix：舊版 usedSkills 曾把 Boss 的施法
            也混入玩家清單、前端無標註）：L8 SKILL_DEMON 限定，本關 Boss 已施放的
            弓箭手技能歷史清單（依使用順序），與 usedSkills（玩家清單）分開列出，
            供前端加上「魔王」標籤顯示，不與玩家自己的施法紀錄混淆。
          items:
            type: string
            enum: [PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]

    PveMoveCreateRequest:
      type: object
      required: [row, col]
      description: '純落子；PVE技能一律獨立行動，不附掛於本請求（見 usePveSkill，FR-A2 FR-B5）'
      properties:
        row: { type: integer, minimum: 0, maximum: 10, example: 5 }
        col: { type: integer, minimum: 0, maximum: 10, example: 5 }

    PveSkillUseRequest:
      type: object
      required: [skillType]
      description: >
        PVE技能獨立行動使用請求，不附掛任何落子座標；各欄位於 PVE 情境下的具體語意
        （direction/anchor/target/secondStone 因無伴隨落子而承載的座標角色）詳見
        SkillActionRequest 各欄位 description（FR-A2 FR-B5）。
      allOf:
        - $ref: '#/components/schemas/SkillActionRequest'

    PveShopStateResponse:
      type: object
      properties:
        shopVisitId: { type: string }
        runId: { type: string }
        afterEncounterSequence: { type: integer, example: 1 }
        status: { type: string, enum: [OPEN, CLOSED] }
        rerollCount: { type: integer, example: 0 }
        gold: { type: integer, example: 30 }
        offers:
          type: array
          description: '固定3位：遺物x2＋技能x1（FR-C4）'
          items:
            $ref: '#/components/schemas/PveShopOfferItem'

    PveShopOfferItem:
      type: object
      properties:
        slotIndex: { type: integer, example: 0 }
        offerKind: { type: string, enum: [RELIC, SKILL] }
        relicType:
          type: string
          nullable: true
          enum: [SHARP_BLADE, CHAIN_CORE, DIAGONAL_WALKER, VOLCANO_HEART, TIDE_BREAKWATER, METRONOME, RECYCLER, GEMINI_STAR]
        skillType:
          type: string
          nullable: true
          enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR]
        price: { type: integer, example: 8 }
        purchased: { type: boolean, example: false }

    PveShopPurchaseRequest:
      type: object
      required: [slotIndex]
      properties:
        slotIndex: { type: integer, example: 0, description: '0,1=遺物位；2=技能位（FR-C4）' }

    PveRunResultResponse:
      type: object
      description: 'Run 結算：通關/失敗/放棄皆回傳此結構（FR-C7）'
      properties:
        runId: { type: string }
        status: { type: string, enum: [WON, LOST, ABANDONED] }
        reachedEncounterSequence: { type: integer, example: 3 }
        totalDamageDealt: { type: integer, example: 640 }
        goldEarned: { type: integer, example: 90 }
        goldSpent: { type: integer, example: 60 }
        finalHeldSkills:
          type: array
          items:
            type: object
            properties:
              skillType: { type: string, enum: [HORIZONTAL_SLASH, VERTICAL_SLASH, HEAVEN_EARTH_REVERSAL, PRECISION_SNIPE, SCATTER_SHOT, PIONEER_STAR] }
              quantity: { type: integer }
        finalHeldRelics:
          type: array
          items:
            type: object
            properties:
              relicType:
                type: string
                enum: [SHARP_BLADE, CHAIN_CORE, DIAGONAL_WALKER, VOLCANO_HEART, TIDE_BREAKWATER, METRONOME, RECYCLER, GEMINI_STAR]

  responses:
    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "400001" }
                  data: { type: object }
    Unauthorized:
      description: 未登入或憑證無效
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "401001" }
                  data: { type: object }
    Forbidden:
      description: 權限不足（如非假先方放置開局子）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "403001" }
                  data: { type: object }
    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "404001" }
                  data: { type: object }
    UnprocessableEntity:
      description: 業務規則不滿足（落子不合法、悔非最後一子等）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ManageResponse'
              - type: object
                properties:
                  code: { type: string, example: "422001" }
                  data: { type: object }

# ── STOMP over WebSocket 即時通道（需求 #9 #15 #16 #28 #36 #44）─
# 非 REST，列此供 frontend / backend 對齊；不屬 OpenAPI paths
x-stomp-channels:
  - destination: /topic/room/{roomId}
    purpose: 房間內 Ready 狀態、聊天與真劍勝負職業選擇(ClassSelected)廣播（需求 #7 #35）
  - destination: /topic/game/{gameId}
    purpose: >
      對局狀態更新廣播 GameStateUpdated；真劍勝負額外廣播 ClassesRevealed /
      SkillUsed / VolcanoErupted / WaveSurged / TideTriggered 等技能與場地事件
      （需求 #16 #36 #37 #44），隱藏格僅於觸發時揭露（需求 #44）
  - destination: /topic/game/{gameId}/opening
    purpose: Swap2 開局即時同步與權限控制（需求 #28）
  - destination: /app/game/{gameId}/move
    purpose: 玩家送出落子（可附掛 skill，後端驗證後廣播；需求 #36）
