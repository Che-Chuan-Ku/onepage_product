# ── 專案技術棧定義 ─────────────────────────────────────
# 用途：定義本專案使用的所有技術，確保 AI 執行時不使用未定義的技術
# 產出時機：kickoff 等效流程完成後（demand_analysis 模組）
# 生命週期：P1 可修正 → P2 凍結 → P3-P5 唯讀
# 來源：documents/需求明細.csv 技術實現建議欄

# ── 後端技術棧 ──────────────────────────────────────────
backend:
  stack: java
  framework: Spring Boot 3.2 + Spring Security + JPA + Spring WebSocket(STOMP) + Cucumber 7.15 + Testcontainers
  test_strategy: e2e
  database: PostgreSQL
  migration: Flyway
  auth: JWT (Spring Security)
  realtime: STOMP over WebSocket
  skills:
    - aibdd-auto-backend-starter
    - aibdd-auto-control-flow
    - aibdd-auto-red
    - aibdd-auto-green
    - aibdd-auto-refactor

# ── 前端技術棧 ──────────────────────────────────────────
frontend:
  stack: react
  framework: Next.js 14 + React 18 + Tailwind CSS + Framer Motion + Canvas/SVG + MSW 2.x + Playwright
  realtime_client: STOMP.js / SockJS
  skills:
    - aibdd-auto-frontend-apifirst-msw-starter
    - aibdd-auto-frontend-msw-api-layer
    - aibdd-auto-frontend-nextjs-pages
    - aibdd.frontend.e2e.activity-testplan

# ── 中介軟體 / 基礎設施依賴 ──────────────────────────────
# discovery 過程依需求自動偵測追加
dependencies:
  - name: Redis
    purpose: 線上單場遊戲狀態快取 / 排行榜快取 / 多實例 Sticky Session（需求 #3 #22）
    added_at: "2026-05-24"
    added_by: discovery
  - name: PostgreSQL
    purpose: 使用者帳號、戰績、遊戲歷史與回放（含開局 stones JSONB）持久化（需求 #1 #3 #17 #32）
    added_at: "2026-05-24"
    added_by: discovery

# ── 共用 Skill ──────────────────────────────────────────
common_skills:
  - aibdd-kickoff
  - aibdd-discovery
  - aibdd-composition-analysis
  - clarify-loop
  - aibdd-core
  - aibdd-form-activity
  - aibdd-form-feature-spec
  - aibdd-form-api-spec
  - aibdd-form-entity-spec
  - aibdd-form-bdd-analysis
  - aibdd-consistency-analyzer
  - aibdd-specformula
  - aibdd-carry-on-engineering-plan
