  - "Local Swap2: impure setStones updater `(s)=>[...s,demo[i++]]` + reactStrictMode double-invoke -> demo[3]=undefined -> GomokuBoard.set reads undefined.r -> page crash. Fixed: pure updater `setStones(demo.slice(0,i))` + GomokuBoard.set `.filter(Boolean)`. (user-reported 2026-06-10)"
