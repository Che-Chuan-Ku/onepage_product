  scope: "added frontend/e2e/pve-real-api.spec.ts — the durable, committed real-backend Playwright counterpart to real-api.spec.ts (PVP), formalizing what the 2026-07-07 round only did via a one-off curl+node script (gate-a-contract-safeparse-script.mjs)"
