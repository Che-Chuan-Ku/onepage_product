  bug_found_real_frontend_defect_not_fixed:
    symptom: "PVE HORIZONTAL_SLASH/VERTICAL_SLASH (axis) skills are 100% unusable against the real backend — every attempt returns 422 UNPROCESSABLE '必須指定施法錨點', not an edge case"
    root_cause: "frontend/src/app/pve/game/[encounterId]/page.tsx pickSkillDirection() (~line 246-253) sets stage straight to 'ready' after direction pick for axis-mode skills, never collecting an anchor; onSkillCellClick() (~line 255-288) has branches for ultimate/target/scatter modes only, no axis branch. frontend/src/lib/game/pveBoard.ts:94-102 buildSkillRequest() therefore always sends anchor:null for axis skills."
    contract_basis: "specs/api.yml SkillActionRequest.anchor description: PVP uses the accompanying move's row/col as the reference cell (this field unused); PVE — being an independent action with no accompanying move — REQUIRES this field to carry the reference cell. Backend backend/src/main/java/com/gomoku/service/PveChallengeService.java:392-395 requireAnchor() correctly enforces this per contract; the backend is NOT the bug."
    why_msw_never_caught_it: "frontend/src/lib/game/pveBoard.ts:14-20 header comment self-admits the mock engine treats PVE skills as 'bookkeeping-only ... no server state for this file to mirror' — MSW never validates the anchor field, so pve-game.spec.ts's skill test has been green under mock this whole time while being 100% broken against the real backend."
    not_fixed_because: "root cause lives in frontend/src/ (product code), out of this round's authorized scope (integration-test/ + frontend/e2e/ test scripts only; product bugs are to be reported, not auto-fixed per this round's explicit instructions)"
    suggested_fix: "add an axis branch to onSkillCellClick (board cell click -> set anchor -> stage='ready') plus a UI prompt '請選擇參考格' after direction pick, mirroring the existing ultimate-mode anchor-collection flow"
    test_lock: "frontend/e2e/pve-real-api.spec.ts's 已知bug describe block uses test.fail() to lock in the current (broken) 422 behavior — if/when the frontend fix lands, this test will unexpectedly pass and Playwright will flag it, forcing a follow-up update/removal rather than silently normalizing the bug"
  status: "SUPERSEDED 2026-07-08 — see anchor_bugfix_verified_2026_07_08 below; the frontend module fixed the root cause and this module unlocked the test_lock accordingly."

